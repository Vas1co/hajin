<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d0b">
  <meta name="description" content="Modern Warfare 4 DMZ Hajin haritası için Türkçe rehber: etkileşimli harita, lokasyonlar, görevler ve eşyalar.">
  <title>Hajin Rehberi · MW4 DMZ · Türkçe</title>
  <!-- Arama motorları için asıl adres (eski github.io adresi buraya yönlenir) -->
  <link rel="canonical" href="https://dmz.peekdock.com/">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Noto+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
  <link rel="stylesheet" href="lib/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <a class="atla" href="#icerik">İçeriğe geç</a>

  <header class="ust">
    <a class="logo" href="#/">
      <img class="logo-resim" src="logo.gif" alt="" width="68" height="38">
      <span class="logo-yazi"><b data-site-ad>Hajin Rehberi</b><small data-site-alt>MW4 DMZ · Türkçe</small></span>
    </a>
    <nav id="ust-menu" class="ust-menu" aria-label="Ana menü"></nav>
    <span class="canli"><i></i>Sezon 0</span>
  </header>

  <main id="icerik">
    <section id="sayfa-ana" class="sayfa" hidden></section>

    <section id="sayfa-harita" class="sayfa sayfa-harita" hidden>
      <!-- Bilgisayarda haritanın solunda durur, telefonda alttan açılır -->
      <aside class="harita-panel" id="harita-panel" aria-label="Katmanlar">
        <div class="panel-ust">
          <label class="arama-kutusu">
            <span data-ikon="ara"></span>
            <input type="search" id="harita-ara" placeholder="Ara: anahtar, kale, eşya, görev…" autocomplete="off" aria-label="Haritada ve bütün sitede ara">
          </label>
          <button class="dugme-ikon panel-kapat" id="panel-kapat" aria-label="Paneli kapat" data-ikon="kapat"></button>
        </div>
        <div id="harita-sonuclar" class="arama-sonuclari" hidden></div>
        <div class="panel-govde">
          <div class="isaret-ozeti" id="isaret-ozeti" hidden>
            <span data-ikon="isaretle"></span>
            <span id="isaret-sayisi"></span>
            <button class="dugme dugme-kucuk" id="isaret-temizle">Temizle</button>
          </div>
          <div id="harita-filtreler"></div>
          <div class="panel-alt">
            <button class="dugme dugme-kucuk" id="filtre-hepsi">Hepsini göster</button>
            <button class="dugme dugme-kucuk" id="filtre-hicbiri">Hepsini gizle</button>
          </div>
        </div>
      </aside>

      <div class="harita-alan">
        <div id="harita" class="harita-kap"></div>
        <div class="harita-araclar">
          <button class="arac" id="arac-katman" aria-expanded="false" aria-controls="harita-panel" data-ikon="katman"><span>Katmanlar</span></button>
          <button class="arac" id="arac-koordinat" aria-pressed="false" data-ikon="koordinat"><span>Koordinat</span></button>
          <button class="arac" id="arac-sifirla" data-ikon="sifirla"><span>Sıfırla</span></button>
        </div>
        <div id="koordinat-gosterge" class="koordinat-gosterge" hidden></div>
      </div>
    </section>

    <section id="sayfa-lokasyonlar" class="sayfa" hidden></section>
    <section id="sayfa-gorevler" class="sayfa" hidden></section>
    <section id="sayfa-esyalar" class="sayfa" hidden></section>
    <section id="sayfa-rehber" class="sayfa" hidden></section>
  </main>

  <footer class="alt-bilgi">
    <p id="site-guncelleme"></p>
    <p>Resmi olmayan bir hayran sitesidir, Activision ile bağlantısı yoktur. Call of Duty, Modern Warfare, harita görseli ve oyun ikonları Activision'a aittir. Harita koordinatları ve oyun ikonları callofduty.com'daki resmi haritadan alınmıştır.</p>
  </footer>

  <nav id="alt-menu" class="alt-menu" aria-label="Menü"></nav>

  <!-- Harita kütüphanesi projenin içinde: internet olmadan da çalışır (Leaflet 1.9.4, BSD-2 lisansı: lib/leaflet/LICENSE) -->
  <script src="lib/leaflet/leaflet.js"></script>

  <!-- Veriler: bilgileri bu dosyalardan düzenle -->
  <script src="veri/site.js"></script>
  <script src="veri/kategoriler.js"></script>
  <script src="veri/resmi_noktalar.js"></script>
  <script src="veri/noktalar.js"></script>
  <script src="veri/lokasyonlar.js"></script>
  <script src="veri/gorevler.js"></script>
  <script src="veri/esyalar.js"></script>
  <script src="veri/esyalar_dmzhub.js"></script>
  <script src="veri/malzemeler.js"></script>
  <script src="veri/kilavuzlar.js"></script>
  <script src="veri/esya_resimleri.js"></script>
  <script src="veri/rehber.js"></script>

  <script src="js/koruma.js"></script>
  <script src="js/ikonlar.js"></script>
  <script src="js/ortak.js"></script>
  <script src="js/arama.js"></script>
  <script src="js/harita.js"></script>
  <script src="js/sayfalar.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
